name: WebGL Build and Deploy

# main에 병합될 때와 수동 실행 시에만 빌드한다.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 이전 실행을 취소하고 최신 커밋만 배포한다.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build WebGL
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Project/Library
          key: Library-WebGL-${{ hashFiles('Project/Assets/**', 'Project/Packages/**', 'Project/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Project
          targetPlatform: WebGL
          buildsPath: build

      # 빌드 폴더 구조가 버전에 따라 다를 수 있으므로 index.html 위치를 찾아 배포 경로로 쓴다.
      - name: Locate build output
        id: locate
        run: |
          index_file=$(sudo find build/WebGL -name index.html | head -n 1)
          if [ -z "$index_file" ]; then
            echo "index.html not found in build output"
            exit 1
          fi
          echo "directory=$(dirname "$index_file")" >> "$GITHUB_OUTPUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.directory }}

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
